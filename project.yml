name: Momento
options:
  bundleIdPrefix: com.tenzin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Momento:
    type: application
    platform: iOS
    sources:
      - path: Momento
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenzin.momento
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Momento/Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
      gatherCoverageData: false
schemes:
  Momento:
    build:
      targets:
        Momento: all
    run:
      config: Debug
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release
